<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Video Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="player" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const videoId = params.get('v');
            if (!videoId) {
                document.body.innerHTML = '<p style="color:#fff;text-align:center;padding:20px;">No video specified. Use ?v=VIDEO_ID</p>';
                return;
            }
            const embedParams = new URLSearchParams({
                autoplay: '1',
                mute: '1',
                controls: '0',
                loop: '1',
                rel: '0',
                modestbranding: '1',
                playsinline: '1',
                enablejsapi: '1',
                playlist: videoId
            });
            document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?' + embedParams.toString();
        })();
    </script>
</body>
</html>
