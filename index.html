<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Video Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            var params = new URLSearchParams(window.location.search);
            var videoId = params.get('v');
            if (!videoId) {
                document.body.innerHTML = '<p style="color:#fff;text-align:center;padding:20px;">No video specified</p>';
                return;
            }
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    controls: 0,
                    loop: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    playlist: videoId
                },
                events: {
                    onReady: function() {
                        player.unMute();
                        player.setVolume(30);
                        // Forza la massima qualità disponibile
                        player.setPlaybackQuality('highres');
                        // Prova a impostare qualità ancora più alta dopo un secondo
                        setTimeout(function() {
                            var availableQualities = player.getAvailableQualityLevels();
                            if (availableQualities && availableQualities.length > 0) {
                                // Prende la qualità più alta disponibile
                                var bestQuality = availableQualities[availableQualities.length - 1];
                                player.setPlaybackQuality(bestQuality);
                            }
                        }, 2000);
                    },
                    onPlaybackQualityChange: function() {
                        // Se la qualità cambia, prova a mantenerla alta
                        var currentQuality = player.getPlaybackQuality();
                        if (currentQuality !== 'highres' && currentQuality !== 'hd2160' && currentQuality !== 'hd1440' && currentQuality !== 'hd1080') {
                            player.setPlaybackQuality('highres');
                        }
                    }
                }
            });
        }

        window.addEventListener('message', function(e) {
            if (!player || !player.setVolume) return;
            var data = e.data;
            if (data === 'toggleMute') {
                if (player.isMuted()) {
                    player.unMute();
                } else {
                    player.mute();
                }
            } else if (data.type === 'setVolume') {
                player.setVolume(data.volume);
            } else if (data === 'volumeUp') {
                var vol = Math.min(player.getVolume() + 10, 100);
                player.setVolume(vol);
            } else if (data === 'volumeDown') {
                var vol = Math.max(player.getVolume() - 10, 0);
                player.setVolume(vol);
            }
        });
    </script>
</body>
</html>
