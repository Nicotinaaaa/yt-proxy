<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Background Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        #player iframe { width: 100%; height: 100%; pointer-events: none; }
        #fallback { display: none; }
    </style>
</head>
<body>
    <div id="player"></div>
    <div id="fallback"></div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var videoId = params.get('v');
        if (!videoId) {
            document.body.innerHTML = '<p style="color:#fff;font-family:Arial;text-align:center;padding:20px;">No video specified</p>';
            throw new Error('No video ID');
        }

        var embed = document.createElement('iframe');
        embed.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + videoId + '&modestbranding=1&rel=0&enablejsapi=1&origin=' + encodeURIComponent(window.location.origin);
        embed.frameBorder = '0';
        embed.allow = 'autoplay; encrypted-media';
        embed.allowFullscreen = false;
        document.getElementById('player').appendChild(embed);

        var currentVolume = 30;
        var isMuted = true;

        function sendCommand(func, args) {
            try {
                embed.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: func,
                    args: args || []
                }), '*');
            } catch(e) {}
        }

        window.addEventListener('message', function(e) {
            var data = e.data;
            if (data === 'volumeUp') {
                currentVolume = Math.min(currentVolume + 10, 100);
                sendCommand('setVolume', [currentVolume]);
            } else if (data === 'volumeDown') {
                currentVolume = Math.max(currentVolume - 10, 0);
                sendCommand('setVolume', [currentVolume]);
            } else if (data === 'toggleMute') {
                isMuted = !isMuted;
                sendCommand(isMuted ? 'mute' : 'unMute', []);
            } else if (data.type === 'setVolume') {
                currentVolume = data.volume;
                sendCommand('setVolume', [currentVolume]);
            }
        });

        try { window.parent.postMessage({ type: 'proxyReady' }, '*'); } catch(e) {}
    </script>
</body>
</html>
