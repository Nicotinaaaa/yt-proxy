<!DOCTYPE html>
<!-- 
    PROXY PER YOUTUBE - FIVEM LOADING SCREEN
    ==========================================
    Questo file va caricato su un repo GitHub con GitHub Pages attivo.
    Usalo COME FALLBACK se il video non parte con l'embed diretto.
    
    Per deploy:
    1. Crea un repo GitHub (es. "yt-proxy")
    2. Carica QUESTO file come "index.html"
    3. Vai a Settings > Pages > seleziona "main" branch > Save
    4. Usa l'URL "https://TUOUSERNAME.github.io/yt-proxy/?v=VIDEO_ID"
       nel tuo index.html come iframe src
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Background Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var videoId;

        function onYouTubeIframeAPIReady() {
            var params = new URLSearchParams(window.location.search);
            videoId = params.get('v');
            if (!videoId) {
                document.body.innerHTML = '<p style="color:#fff;font-family:Arial;text-align:center;padding:20px;">No video specified</p>';
                return;
            }
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    controls: 0,
                    loop: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    playlist: videoId,
                    enablejsapi: 1
                },
                events: {
                    onReady: function(event) {
                        event.target.setVolume(30);
                        event.target.setPlaybackQuality('highres');
                        // Avvisa il genitore che il player è pronto
                        window.parent.postMessage({ type: 'proxyReady' }, '*');
                    }
                }
            });
        }

        window.addEventListener('message', function(e) {
            if (!player || !player.setVolume) return;
            var data = e.data;
            if (data === 'toggleMute') {
                if (player.isMuted()) {
                    player.unMute();
                } else {
                    player.mute();
                }
            } else if (data.type === 'setVolume') {
                player.setVolume(data.volume);
            } else if (data === 'volumeUp') {
                var vol = Math.min(player.getVolume() + 10, 100);
                player.setVolume(vol);
            } else if (data === 'volumeDown') {
                var vol = Math.max(player.getVolume() - 10, 0);
                player.setVolume(vol);
            }
        });
    </script>
</body>
</html>
