<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Background Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        #player iframe { width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var videoId;
        var currentVolume = 50;
        var isMuted = false;

        function onYouTubeIframeAPIReady() {
            var params = new URLSearchParams(window.location.search);
            videoId = params.get('v');
            if (!videoId) {
                document.body.innerHTML = '<p style="color:#fff;font-family:Arial;text-align:center;padding:20px;">No video specified</p>';
                return;
            }
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    controls: 0,
                    loop: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    playlist: videoId,
                    enablejsapi: 1,
                    origin: window.location.origin
                },
                events: {
                    onReady: function(event) {
                        event.target.setVolume(currentVolume);
                        try { window.parent.postMessage({ type: 'proxyReady' }, '*'); } catch(e) {}
                    }
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 32) {
                e.preventDefault();
                e.stopPropagation();
            }
        });
        document.addEventListener('keyup', function(e) {
            if (e.keyCode === 32) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        window.addEventListener('message', function(e) {
            if (!player || !player.setVolume) return;
            var data = e.data;
            if (data === 'volumeUp') {
                currentVolume = Math.min(currentVolume + 10, 100);
                player.setVolume(currentVolume);
            } else if (data === 'volumeDown') {
                currentVolume = Math.max(currentVolume - 10, 0);
                player.setVolume(currentVolume);
            } else if (data === 'toggleMute') {
                isMuted = !isMuted;
                if (isMuted) { player.mute(); } else { player.unMute(); }
            } else if (data.type === 'setVolume') {
                currentVolume = data.volume;
                player.setVolume(currentVolume);
            }
        });
    </script>
</body>
</html>
