<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Background Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        #player iframe { width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var videoId = params.get('v');
        if (!videoId) {
            document.body.innerHTML = '<p style="color:#fff;font-family:Arial;text-align:center;padding:20px;">No video specified</p>';
            throw new Error('No video ID');
        }

        var embed = document.createElement('iframe');
        embed.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + videoId + '&modestbranding=1&rel=0&enablejsapi=1&origin=' + encodeURIComponent(window.location.origin) + '&iv_load_policy=3&cc_load_policy=0';
        embed.frameBorder = '0';
        embed.allow = 'autoplay';
        embed.allowFullscreen = false;
        embed.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;pointer-events:none;';
        document.getElementById('player').appendChild(embed);

        var currentVolume = 50;
        var isMuted = true;

        function sendCommand(func, args) {
            try {
                embed.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: func,
                    args: args || []
                }), '*');
            } catch(e) {}
        }

        var ready = false;
        var attempts = 0;
        function tryUnmute() {
            if (!ready) return;
            if (attempts > 15) return;
            attempts++;
            sendCommand('unMute', []);
            sendCommand('setVolume', [currentVolume]);
            setTimeout(tryUnmute, 300);
        }

        window.addEventListener('message', function onEmbedReady(e) {
            try {
                var d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                if (d.event === 'onReady' && d.info && d.info.videoId) {
                    ready = true;
                    setTimeout(tryUnmute, 500);
                    window.removeEventListener('message', onEmbedReady);
                }
            } catch(e) {}
        });

        setTimeout(function() { ready = true; if (attempts === 0) { tryUnmute(); } }, 3000);

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 32) {
                e.preventDefault();
                e.stopPropagation();
            }
        });
        document.addEventListener('keyup', function(e) {
            if (e.keyCode === 32) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        window.addEventListener('message', function(e) {
            var data = e.data;
            if (data === 'volumeUp') {
                currentVolume = Math.min(currentVolume + 10, 100);
                sendCommand('setVolume', [currentVolume]);
            } else if (data === 'volumeDown') {
                currentVolume = Math.max(currentVolume - 10, 0);
                sendCommand('setVolume', [currentVolume]);
            } else if (data === 'toggleMute') {
                isMuted = !isMuted;
                sendCommand(isMuted ? 'mute' : 'unMute', []);
                if (!isMuted) sendCommand('setVolume', [currentVolume]);
            } else if (data.type === 'setVolume') {
                currentVolume = data.volume;
                sendCommand('setVolume', [currentVolume]);
            }
        });

        try { window.parent.postMessage({ type: 'proxyReady' }, '*'); } catch(e) {}
    </script>
</body>
</html>
